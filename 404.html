<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H Card — Page Not Found</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1220; color: #e5e7eb;
      min-height: 100vh; margin: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .box { max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
    a {
      display: inline-block; background: #1a56db; color: #fff;
      border-radius: 9px; padding: 10px 16px;
      font-size: 13px; font-weight: 700; text-decoration: none;
    }
    a:hover { background: #1141a8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page Not Found</h1>
    <p>The address you opened does not exist on this site.</p>
    <a href="/H-CARD/">Go to H Card</a>
  </div>
  <script>
    // GitHub Pages serves this file for unknown paths; legacy /card/<ID> path
    // URLs are redirected client-side to the hash route used by the app.
    (function () {
      var match = location.pathname.match(/\/card\/([^\/?#]+)\/?$/);
      if (match) {
        var base = location.pathname.slice(0, match.index + 1);
        location.replace(base + '#/card/' + encodeURIComponent(match[1]));
      }
    })();
  </script>
</body>
</html>
